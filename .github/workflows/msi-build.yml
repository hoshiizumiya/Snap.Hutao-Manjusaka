name: Build MSI Installer

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Wix Toolset 4
        run: dotnet tool install --global wix --version 4.0.1

      - name: Restore NuGet packages
        run: dotnet restore src/Snap.Hutao/Snap.Hutao.slnx
        
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        
        # 使用 MSBuild 构建 WiX installer 项目（已包含项目依赖）
      - name: Build MSI installer with MSBuild
        run: msbuild src/Snap.Hutao/Snap.Hutao.Installer/Snap.Hutao.Installer.wixproj /p:Configuration=Release /p:Platform=x64 /m /p:PlatformToolset=v143
        
      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Snap.Hutao.Installer
          path: |
            src/Snap.Hutao/Snap.Hutao.Installer/bin/x64/Release/en-US/*.msi

  release:
      needs: build
      runs-on: ubuntu-latest
      if: |
        github.ref == 'refs/heads/master' &&
        github.event_name == 'push'

      steps:
        - name: Download build artifact
          uses: actions/download-artifact@v6
          with:
            name: Snap.Hutao.Installer
            path: out

        - name: Publish or update prerelease
          uses: ncipollo/release-action@v1
          with:
            tag: latest
            name: Latest
            prerelease: false
            allowUpdates: true
            replacesArtifacts: true
            artifacts: out/*.msi
            generateReleaseNotes: true
            body: |
              Auto-updated canary package.
              Date: ${{ needs.build.outputs.date }}
              Branch: ${{ github.ref_name }}
              Commit: ${{ github.sha }}

              Trigger: ${{ github.event_name }}
              Actor: ${{ github.actor }}